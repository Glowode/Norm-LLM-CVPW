[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvpw-py"
version = "0.1.0"
description = "Server-side analysis for the Norm-LLM-CVPW framework: audio to a timebase, and a synthetic self-test signal."
requires-python = ">=3.10"
license = { text = "MIT" }
# numpy and soundfile are the only hard dependencies, and both ship manylinux/windows wheels, so a
# fresh machine can run `cvpw analyze` without a compiler. librosa is optional and only changes the
# quality of tempo estimation, never whether the tool runs (docs/SPEC.md P7).
dependencies = ["numpy>=1.24", "soundfile>=0.12"]

[project.optional-dependencies]
# Better tempo and beat estimation. Worth installing when the overview plot shows an ambiguous tempo;
# not required, and its absence must never be more than a quality difference.
beats = ["librosa>=0.10"]
dev = ["pytest>=8"]

[project.scripts]
cvpw-py = "cvpw_py.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
